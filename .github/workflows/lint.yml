name: Lint

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.12'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pylint flake8 black isort

    - name: Run flake8
      run: |
        # Stop the build if there are Python syntax errors or undefined names
        flake8 SpaceTradingFX/flask_dashboard --count --select=E9,F63,F7,F82 --show-source --statistics
        flake8 SpaceTradingFX/flask_dashboard --count --max-complexity=20 --max-line-length=120 --statistics

    - name: Run pylint
      run: |
        pylint SpaceTradingFX/flask_dashboard --max-line-length=120 --disable=C0114,C0115,C0116,R0903,R0913 || true

    - name: Check formatting with black
      run: |
        black --check SpaceTradingFX/flask_dashboard --line-length=120

    - name: Check import sorting with isort
      run: |
        isort --check-only SpaceTradingFX/flask_dashboard
