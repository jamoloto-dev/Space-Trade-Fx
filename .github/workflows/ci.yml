# SpaceTradingFX CI/CD Pipeline
# Runs tests, builds Docker image, and deploys on push to main

name: CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  PYTHON_VERSION: '3.12'

jobs:
  # Lint and type checking
  lint:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff mypy
          pip install -r SpaceTradingFX/requirements.txt

      - name: Run Ruff linter
        run: ruff check SpaceTradingFX/ --output-format=github
        continue-on-error: true

      - name: Run Ruff formatter check
        run: ruff format --check SpaceTradingFX/
        continue-on-error: true

  # Run tests
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    needs: lint
    
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test_spacetradingfx
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r SpaceTradingFX/requirements.txt
          pip install pytest pytest-cov pytest-flask

      - name: Run tests
        env:
          FLASK_ENV: testing
          SESSION_SECRET: test-secret-key-for-ci
          DATABASE_URL: postgresql://test:test@localhost:5432/test_spacetradingfx
        working-directory: SpaceTradingFX
        run: |
          pytest tests/ -v --cov=flask_dashboard --cov-report=xml --cov-report=term-missing

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          file: SpaceTradingFX/coverage.xml
          fail_ci_if_error: false
        continue-on-error: true

  # Security scan
  security:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'table'
          severity: 'CRITICAL,HIGH'
        continue-on-error: true

  # Build Docker image
  build:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs: [test]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: spacetradingfx:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Test Docker image
        run: |
          docker run -d --name test-container \
            -e SESSION_SECRET=test-secret \
            -e FLASK_ENV=testing \
            -p 8000:8000 \
            spacetradingfx:${{ github.sha }}
          
          sleep 10
          
          # Health check
          curl -f http://localhost:8000/health || exit 1
          
          docker stop test-container
          docker rm test-container

  # Deploy (placeholder - configure for your hosting)
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    needs: [build]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    # environment: production  # Uncomment after creating 'production' environment in GitHub settings
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy notification
        run: |
          echo "🚀 Deployment triggered for commit ${{ github.sha }}"
          echo "Configure this step for your deployment target:"
          echo "  - Azure Container Apps"
          echo "  - AWS ECS"
          echo "  - Google Cloud Run"
          echo "  - Heroku"
          echo "  - DigitalOcean App Platform"
