# Render Blueprint Specification for SpaceTradingFX
# Docs: https://render.com/docs/blueprint-spec

services:
  # ---------------------------------------------------------------------------
  # Primary Web Service - Space-Trade-Fx (Public Institutional Trading Platform)
  # ---------------------------------------------------------------------------
  - type: web
    name: space-trade-fx
    runtime: docker
    region: frankfurt
    plan: starter
    healthCheckPath: /health/live
    envVars:
      - key: FLASK_ENV
        value: production
      - key: SESSION_SECRET
        generateValue: true
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        sync: false
      - key: METAAPI_TOKEN
        sync: false
      - key: METAAPI_ACCOUNT_ID
        sync: false
      - key: METAAPI_REGION
        value: london
      - key: MARKET_DATA_PROVIDER
        value: simulation
      - key: ENABLE_SPACE_TRADE_WORKER
        value: "true"
      - key: TRADE_WORKER_INTERVAL
        value: "30"

  # ---------------------------------------------------------------------------
  # Secondary Telemetry & Visualization Terminal (Streamlit)
  # ---------------------------------------------------------------------------
  - type: web
    name: quantbot-dashboard
    runtime: python
    region: frankfurt
    plan: free # Can run on free or starter tier
    buildCommand: pip install --upgrade pip && pip install -r requirements.txt
    startCommand: streamlit run dashboard/app.py --server.port $PORT --server.address 0.0.0.0 --server.headless true
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.3
      - key: METAAPI_TOKEN
        sync: false
      - key: METAAPI_ACCOUNT_ID
        sync: false
