[project]
name = "SpaceTradingFX"
version = "1.0.0"
description = "Automated Forex Trading Platform with Flask Dashboard"
requires-python = ">=3.10"
authors = [
    { name = "SpaceTradingFX Team" }
]
readme = "SpaceTradingFX/README.md"
license = { text = "MIT" }
dependencies = [
    # Core Flask Framework
    "flask>=3.1.0",
    "flask-login>=0.6.3",
    "flask-sqlalchemy>=3.1.1",
    "flask-dance>=7.1.0",
    "flask-wtf>=1.2.0",
    "flask-limiter>=3.5.0",
    "flask-migrate>=4.0.0",
    "werkzeug>=3.0.0",
    
    # Database
    "sqlalchemy>=2.0.0",
    
    # Security & Authentication  
    "cryptography>=42.0.0",
    "pyjwt>=2.8.0",
    "rsa>=4.9",
    
    # HTTP & API
    "requests>=2.31.0",
    "urllib3>=2.7.0",
    
    # Data Analysis
    "pandas>=2.0.0",
    
    # Logging & Scheduling
    "loguru>=0.7.0",
    "schedule>=1.2.0",
    
    # Payment Processing
    "stripe>=12.0.0",
    
    # Environment
    "python-dotenv>=1.0.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["SpaceTradingFX"]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.0.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
    "pip-audit>=2.7.0",
]
production = [
    "gunicorn>=21.0.0",
    "psycopg2-binary>=2.9.0",
    "psycopg[binary]>=3.1.0",
]
trading = [
    # MetaTrader5 - Windows only
    # "MetaTrader5>=5.0.0",
]

[project.scripts]
spacetradingfx = "flask_dashboard.main:main"
spacetradingfx-paper-worker = "flask_dashboard.paper_worker:main"

[tool.ruff]
line-length = 120
target-version = "py310"
exclude = [
    ".git",
    ".venv",
    "venv",
    "migrations",
    "SpaceTradingFX/space_trading_fx",
]

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
warn_unused_configs = true
disallow_untyped_defs = false
check_untyped_defs = false
exclude = [
    "migrations",
    "SpaceTradingFX/space_trading_fx",
    "venv",
    ".venv",
]

[[tool.mypy.overrides]]
module = "flask_dashboard.models"
disable_error_code = ["name-defined"]
