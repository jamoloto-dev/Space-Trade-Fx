# SpaceTradingFX Docker Compose
# Development and production configurations

services:
  # Main Flask application
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - FLASK_ENV=production
      - SESSION_SECRET=${SESSION_SECRET:?SESSION_SECRET must be set}
      - DATABASE_URL=postgresql://spacetradingfx:${DB_PASSWORD:?DB_PASSWORD must be set}@db:5432/spacetradingfx
      - LICENSE_PUBLIC_KEY_PEM=${LICENSE_PUBLIC_KEY_PEM:?LICENSE_PUBLIC_KEY_PEM must be set}
      - LICENSE_PRIVATE_KEY_PEM=${LICENSE_PRIVATE_KEY_PEM:?LICENSE_PRIVATE_KEY_PEM must be set}
      - REDIS_URL=redis://redis:6379/0
      - STRIPE_SECRET_KEY=${STRIPE_SECRET_KEY:-}
      - STRIPE_PUBLISHABLE_KEY=${STRIPE_PUBLISHABLE_KEY:-}
      - STRIPE_WEBHOOK_SECRET=${STRIPE_WEBHOOK_SECRET:-}
      - SMTP_HOST=${SMTP_HOST:-smtp.gmail.com}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_USER=${SMTP_USER:-}
      - SMTP_PASSWORD=${SMTP_PASSWORD:-}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health/live"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # Exactly one separately managed process performs paper lifecycle work.
  # Do not scale this service; its database lease is a second safety guard.
  paper-worker:
    build:
      context: .
      dockerfile: Dockerfile
    command: ["paper-worker"]
    environment:
      - FLASK_ENV=production
      - SESSION_SECRET=${SESSION_SECRET:?SESSION_SECRET must be set}
      - DATABASE_URL=postgresql://spacetradingfx:${DB_PASSWORD:?DB_PASSWORD must be set}@db:5432/spacetradingfx
      - LICENSE_PUBLIC_KEY_PEM=${LICENSE_PUBLIC_KEY_PEM:?LICENSE_PUBLIC_KEY_PEM must be set}
      - LICENSE_PRIVATE_KEY_PEM=${LICENSE_PRIVATE_KEY_PEM:?LICENSE_PRIVATE_KEY_PEM must be set}
      - REDIS_URL=redis://redis:6379/0
      - PAPER_WORKER_INTERVAL=${PAPER_WORKER_INTERVAL:-30}
      - PAPER_TRADING_KILL_SWITCH=${PAPER_TRADING_KILL_SWITCH:-false}
      - MARKET_DATA_PROVIDER=${MARKET_DATA_PROVIDER:-simulation}
      - ALPHA_VANTAGE_API_KEY=${ALPHA_VANTAGE_API_KEY:-}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    restart: unless-stopped

  # PostgreSQL Database
  db:
    image: postgres:15-alpine
    environment:
      - POSTGRES_USER=spacetradingfx
      - POSTGRES_PASSWORD=${DB_PASSWORD:?DB_PASSWORD must be set}
      - POSTGRES_DB=spacetradingfx
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U spacetradingfx -d spacetradingfx"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis for caching and rate limiting
  redis:
    image: redis:7-alpine
    volumes:
      - redis_data:/data
    restart: unless-stopped
    command: redis-server --appendonly yes

volumes:
  postgres_data:
  redis_data:
