{% extends "mobile_base.html" %}

{% block content %}
<!-- Connection Status -->
<div class="connection-status">
    <div class="status status--warning">
        <span class="status-dot inactive"></span>
        PAPER TRADING ONLY — BROKER CONNECTION DISABLED
    </div>
</div>

<!-- Paper ledger icon -->
<div class="mt-logo">
    <div class="paper-logo">
        <span class="paper-logo__mark">P</span>
    </div>
</div>

<div class="section-title">PAPER TRADING STATUS</div>

<form method="POST" action="{{ url_for('mobile.metatrader') }}">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <button type="submit" class="btn-primary">
        <i class="fas fa-shield-alt"></i>
        PAPER TRADING IS ACTIVE
    </button>
</form>

<div style="margin-top: 20px; text-align: center;">
    <a href="{{ url_for('mobile.connect_broker') }}" class="btn-primary" style="display: block; text-decoration: none; background: linear-gradient(135deg, #F59E0B 0%, #D97706 100%); color: #0F172A; font-weight: 800; border-radius: 9999px;">
        <i class="fas fa-plug"></i> Connect MT4 / MT5 Broker Account
    </a>
</div>


<script>
</script>
{% endblock %}
