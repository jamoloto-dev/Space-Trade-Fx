{% extends "mobile_base.html" %}

{% block content %}
<!-- Header -->
<header class="app-header">
    <a href="{{ url_for('mobile.home') }}" class="back-btn">
        <i class="fas fa-arrow-left"></i>
    </a>
    <div>
        <h1>QUOTES</h1>
        <div class="subtitle">{{ symbols|length }} symbols available</div>
    </div>
</header>

<div class="container">
    <form method="POST" action="{{ url_for('mobile.quotes') }}" id="quotesForm">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        {% for symbol in symbols %}
        <div class="symbol-card">
            <div class="symbol-header">
                <span class="symbol-name">{{ symbol.pair }}</span>
                <span class="status-dot {% if not symbol.enabled %}inactive{% endif %}"></span>
                <label class="symbol-toggle">
                    <input type="checkbox" name="enabled_pairs" value="{{ symbol.pair }}" 
                        {% if symbol.enabled %}checked{% endif %}
                        >
                </label>
            </div>
            <div class="details">
                <div class="detail-item">
                    <div class="detail-label">LOT SIZE</div>
                    <div class="lot-size-input">
                        <button type="button" onclick="adjustLot('{{ symbol.pair }}', -0.01)">-</button>
                        <input type="number" name="lot_{{ symbol.pair }}" id="lot_{{ symbol.pair }}" 
                            value="{{ symbol.lot_size }}" step="0.01" min="0.01" max="1">
                        <button type="button" onclick="adjustLot('{{ symbol.pair }}', 0.01)">+</button>
                    </div>
                </div>
                <div class="detail-item">
                    <div class="detail-label">PLATFORM</div>
                    <div class="detail-value">PAPER</div>
                </div>
                <div class="detail-item">
                    <div class="detail-label">DIRECTION</div>
                    <select class="direction-select" name="direction_{{ symbol.pair }}">
                        <option value="BOTH" {% if symbol.direction == 'BOTH' %}selected{% endif %}>BOTH</option>
                        <option value="BUY" {% if symbol.direction == 'BUY' %}selected{% endif %}>BUY</option>
                        <option value="SELL" {% if symbol.direction == 'SELL' %}selected{% endif %}>SELL</option>
                    </select>
                </div>
            </div>
        </div>
        {% endfor %}
        
        <!-- Trading Toggle -->
        <div class="symbol-card trading-toggle {% if trading_enabled %}is-enabled{% endif %}">
            <div class="trading-toggle__row">
                <div>
                    <div class="symbol-name">AUTO-TRADING</div>
                    <div class="detail-label trading-toggle__label">
                        {% if trading_enabled %}BOT IS ACTIVE{% else %}BOT IS PAUSED{% endif %}
                    </div>
                </div>
                <label class="toggle">
                    <input type="checkbox" name="trading_enabled" {% if trading_enabled %}checked{% endif %}
                        >
                    <span class="slider"></span>
                </label>
            </div>
        </div>
        
        <button type="submit" class="btn-primary">
            <i class="fas fa-save"></i>
            SAVE SETTINGS
        </button>
    </form>
</div>

<script>
function adjustLot(pair, delta) {
    const input = document.getElementById('lot_' + pair);
    let value = parseFloat(input.value) + delta;
    value = Math.max(0.01, Math.min(1, value));
    input.value = value.toFixed(2);
}
</script>
{% endblock %}
