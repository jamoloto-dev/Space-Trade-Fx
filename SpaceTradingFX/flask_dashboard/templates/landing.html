<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SpaceTradingFX</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
            background: #C84B61;
            min-height: 100vh;
            color: #FFFFFF;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        
        .logo-container {
            position: relative;
            width: 180px;
            height: 180px;
            margin-bottom: 30px;
        }
        
        .avatar-hat {
            position: absolute;
            top: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 140px;
            height: 50px;
            background: #E53935;
            border-radius: 70px 70px 0 0;
        }
        
        .avatar {
            position: absolute;
            top: 30px;
            left: 50%;
            transform: translateX(-50%);
            width: 140px;
            height: 140px;
            background: #000;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 4px solid #333;
        }
        
        .eyes {
            display: flex;
            gap: 25px;
        }
        
        .eye {
            width: 12px;
            height: 12px;
            background: #fff;
            border-radius: 50%;
        }
        
        h1 {
            font-size: 28px;
            font-weight: 800;
            letter-spacing: 3px;
            margin-bottom: 10px;
            text-align: center;
        }
        
        .subtitle {
            font-size: 14px;
            color: rgba(255, 255, 255, 0.7);
            text-align: center;
            margin-bottom: 40px;
        }
        
        .features {
            width: 100%;
            max-width: 350px;
            margin-bottom: 40px;
        }
        
        .feature {
            display: flex;
            align-items: center;
            gap: 15px;
            padding: 15px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            margin-bottom: 12px;
        }
        
        .feature i {
            font-size: 20px;
            color: #4CAF50;
        }
        
        .feature span {
            font-size: 14px;
        }
        
        .btn-login {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            width: 100%;
            max-width: 350px;
            padding: 18px;
            background: #A13D50;
            border: none;
            border-radius: 12px;
            color: #FFFFFF;
            font-size: 16px;
            font-weight: 600;
            text-decoration: none;
            transition: transform 0.2s, background 0.2s;
        }
        
        .btn-login:active {
            transform: scale(0.98);
            background: #8B3345;
        }
        
        .btn-login i {
            font-size: 20px;
        }
        
        .footer {
            margin-top: 40px;
            font-size: 12px;
            color: rgba(255, 255, 255, 0.5);
            text-align: center;
        }
    </style>
</head>
<body>
    <div class="logo-container">
        <div class="avatar-hat"></div>
        <div class="avatar">
            <div class="eyes">
                <div class="eye"></div>
                <div class="eye"></div>
            </div>
        </div>
    </div>
    
    <h1>SPACETRADINGFX</h1>
    <p class="subtitle">PAPER-TRADING FOREX SIMULATION PLATFORM</p>
    
    <div class="features">
        <div class="feature">
            <i class="fas fa-chart-line"></i>
            <span>Real-time Forex Analysis</span>
        </div>
        <div class="feature">
            <i class="fas fa-robot"></i>
            <span>Automated Trading Signals</span>
        </div>
        <div class="feature">
            <i class="fas fa-link"></i>
            <span>Paper Trading Ledger</span>
        </div>
        <div class="feature">
            <i class="fas fa-shield-alt"></i>
            <span>Advanced Risk Management</span>
        </div>
    </div>
    
    <a href="{{ url_for('auth.login') }}" class="btn-login">
        <i class="fas fa-sign-in-alt"></i>
        SIGN IN / SIGN UP
    </a>
    
    <div class="footer">
        <p>© 2024 SpaceTradingFX. All rights reserved.</p>
        <p style="margin-top: 5px;">Trading carries risk. Trade responsibly.</p>
    </div>
</body>
</html>
